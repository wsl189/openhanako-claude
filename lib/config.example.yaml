# ═══════════════════════════════════════════
# 系统配置（唯一配置源）
# 复制本文件为 config.yaml 并填入你的信息
# ═══════════════════════════════════════════

# 身份信息
agent:
  name: Hanako                           # 你的助手叫什么
  yuan: hanako                           # 源模板：hanako / butter / ming
user:
  name: ""                               # 你的名字

# API 配置（主通道）
# 凭证从全局 ~/.hanako/providers.yaml 或当前 agent 的 providers 块读取
api:
  provider: ""                     # dashscope / volcengine / openai / ...

# Embedding 专用 API（可选）
# 如果 embedding 模型和主模型不在同一个 provider，在这里单独配
embedding_api:
  provider: ""                     # embedding 走哪个 provider

# 模型配置
models:
  chat: ""                         # 主对话模型
  summarizer: ""                   # 旁路摘要模型（便宜快）
  compiler: ""                     # 记忆编译模型（启动快）
  utility: ""                      # 工具模型（对话摘要等轻量任务）
  embedding: ""                    # 向量模型
  embedding_dimensions: 1024       # 向量维度

# 记忆系统配置
# enabled 控制自动记忆维护总开关。
# 即使关闭自动维护，设置页里的查看、编辑、导出、归档等管理能力仍然可用。
# 自动维护依赖 utility 模型；未配置 utility 时，记忆仍可手动管理。
memory:
  enabled: true

# 网页搜索（可选）
# 支持 tavily / serper / brave。启用后需要显式填写 provider 与 api_key。
# 推荐 Tavily（免费 1000 次/月）：https://tavily.com
search:
  provider: ""                           # tavily / serper / brave
  api_key: ""                            # 对应 provider 的 API key

# Skills（per-agent 技能开关）
skills:
  enabled: []                        # 启用的 skill 名称，如 ["pdf", "literary-craft"]

# Claude 运行权限（per-agent）
claude:
  permission_strategy: auto_allow    # auto_allow(默认放行) / none(按运行时策略)

# 工具权限（per-agent）
# 内建工具 Read/Glob/Grep 永远启用。
# 不写 builtin_enabled 时，默认放开全部 Claude 内建工具；若写入数组则按白名单控制。
tools:
  custom_enabled: []                 # 留空表示允许该 agent 的全部 custom tools；非空表示白名单
  pdf2md:
    base_url: ""                     # MinerU PDF2MD 服务地址，如 https://xxx.cpolar.cn 或 http://127.0.0.1:9280
    api_key: ""                      # 可选；若服务端设置 PDF2MD_API_KEY，这里填同一个值
    timeout_ms: 3600000              # PDF 转换最长等待时间，默认 1 小时

# 频道系统（agent 间协作通信）
channels:
  enabled: false                     # 是否参与频道轮转

# 语言偏好
locale: zh-CN

# 时区（用于记忆时间标记）
timezone: ""                       # 时区，如 Asia/Shanghai、America/New_York


# Agent 能力（高级功能，默认关闭）
capabilities:
  learn_skills:
    enabled: true             # 允许 agent 自行编写/安装技能（本地）
    allow_github_fetch: false # 允许从 GitHub 拉取外部技能（高风险，需谨慎）
    min_stars: 100            # GitHub 仓库 star 数门槛，低于此值拒绝安装（默认 100）
