<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; connect-src 'self' ws://127.0.0.1:* http://127.0.0.1:*; img-src 'self' data: file: http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';">
    <title>Skill Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="themes/warm-paper.css" id="themeSheet">
    <style>
        html, body, #react-root {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: var(--bg);
            background-image: var(--bg-texture, none);
            background-repeat: repeat;
            background-size: 400px;
        }
        .sv-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            align-items: stretch;
            justify-content: stretch;
            animation: none;
        }
        .sv-container {
            width: 100%;
            max-width: none;
            height: 100%;
            max-height: none;
            border-radius: 0;
            box-shadow: none;
            animation: none;
        }
    </style>
</head>
<body>
    <div id="react-root"></div>

    <script src="lib/i18n.js"></script>
    <script src="lib/theme.js"></script>
    <script src="modules/platform.js"></script>
    <script type="module" src="./skill-viewer-main.tsx"></script>
</body>
</html>
